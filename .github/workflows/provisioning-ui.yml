name: Provisioning UI

on:
  pull_request:
    paths:
      - 'app/licensing/**'
      - 'app/provision/**'
      - 'components/licensing/**'
      - 'components/provision/**'
      - 'components/ui/**'
      - 'lib/license-control-plane.ts'
      - 'tsconfig.provisioning.json'
      - '.github/workflows/provisioning-ui.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p tsconfig.provisioning.json
