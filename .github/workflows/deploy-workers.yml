name: Deploy Workers

# Deploys the backend Worker (connect) from main. The website (workers/web) is not deployed here: its build needs
# site secrets and its Worker is still a preview. On a push, it deploys only when its files changed; run it by hand
# (workflow_dispatch) to deploy regardless. It is checked (typecheck, tests, dry run) before its database schema is
# applied and it is deployed.
#
# Repository secrets:
#   CLOUDFLARE_API_TOKEN          Workers Scripts:Edit, Workers Routes/Custom Domains:Edit (account + beaglabs.com zone)
#   CLOUDFLARE_ACCOUNT_ID
#   CONNECT_TURSO_DATABASE_URL, CONNECT_TURSO_AUTH_TOKEN   schema for workers/connect
# Worker runtime secrets stay in Cloudflare (wrangler secret put); this workflow never sets them.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: 'Deploy just one Worker (connect); empty deploys all'
        required: false
        default: ''

concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      connect: ${{ steps.pick.outputs.connect }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            connect:
              - 'workers/connect/**'
            workflow:
              - '.github/workflows/deploy-workers.yml'
      - id: pick
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          ONLY: ${{ inputs.only }}
          WORKFLOW: ${{ steps.filter.outputs.workflow }}
        run: |
          for w in connect; do
            case "$w" in
              connect) changed='${{ steps.filter.outputs.connect }}' ;;
            esac
            if [ "$DISPATCH" = "true" ]; then
              if [ -z "$ONLY" ] || [ "$ONLY" = "$w" ]; then changed=true; else changed=false; fi
            elif [ "$WORKFLOW" = "true" ]; then
              changed=true
            fi
            echo "$w=$changed" >> "$GITHUB_OUTPUT"
            echo "$w: $changed"
          done

  connect:
    needs: changes
    if: needs.changes.outputs.connect == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/connect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/connect/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check
        env:
          TURSO_DATABASE_URL: libsql://example.turso.io
          TURSO_AUTH_TOKEN: ci-placeholder
        run: npm run check
      - name: Apply schema
        env:
          TURSO_DATABASE_URL: ${{ secrets.CONNECT_TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.CONNECT_TURSO_AUTH_TOKEN }}
        run: npm run db:apply
      - name: Deploy
        run: npx wrangler deploy --config wrangler.jsonc

