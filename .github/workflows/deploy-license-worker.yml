name: Deploy License Worker

on:
  push:
    branches:
      - main
    paths:
      - 'workers/license/**'
      - '.github/workflows/deploy-license-worker.yml'
  workflow_dispatch:

concurrency:
  group: license-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: workers/license
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify deployment secrets
        shell: bash
        run: |
          missing=0
          for name in TURSO_DATABASE_URL TURSO_AUTH_TOKEN BETTER_AUTH_SECRET CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Worker dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate Worker
        run: npm run check

      - name: Apply production database migrations
        run: npm run db:apply

      - name: Deploy production Worker
        run: npm run deploy:worker
