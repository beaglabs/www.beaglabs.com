name: Deploy Beag Model Training

on:
  push:
    branches: [main]
    paths:
      - "services/model-training/**"
  pull_request:
    branches: [main]
    paths:
      - "services/model-training/**"

env:
  REGISTRY: beagplatform.azurecr.io
  IMAGE_NAME: model-training
  SERVICE_DIR: services/model-training

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: beag
          POSTGRES_PASSWORD: beag_test
          POSTGRES_DB: beag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.SERVICE_DIR }}/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: ${{ env.SERVICE_DIR }}

      - name: Lint
        run: ruff check .
        working-directory: ${{ env.SERVICE_DIR }}

      - name: Tests
        env:
          DATABASE_URL: postgresql+asyncpg://beag:beag_test@localhost:5432/beag_test
        run: pytest tests/ -v --cov=. --cov-report=term-missing
        working-directory: ${{ env.SERVICE_DIR }}
        continue-on-error: true

  build:
    name: Build & Push
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_DIR }}
          file: ${{ env.SERVICE_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Run Migrations
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Run Alembic migrations against Neon
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            migrate

  deploy-staging:
    name: Deploy Staging
    needs: migrate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API to ACA
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: beag-training-staging
          containerAppName: ${{ vars.ACA_API_NAME || 'beag-training-api' }}
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          containerAppEnvironment: ${{ vars.ACA_ENV_NAME || 'beag-training-staging' }}
          targetPort: 8000
          ingress: external

      - name: Deploy Worker to ACA
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: beag-training-staging
          containerAppName: ${{ vars.ACA_WORKER_NAME || 'beag-training-worker' }}
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          containerAppEnvironment: ${{ vars.ACA_ENV_NAME || 'beag-training-staging' }}
          ingress: disabled
          containerAppCommand: worker

      - name: Health check staging
        run: |
          for i in $(seq 1 10); do
            curl -sf "https://${{ vars.ACA_API_NAME }}.${{ vars.ACA_REGION }}.azurecontainerapps.io/health" && exit 0
            sleep 10
          done
          exit 1

  deploy-production:
    name: Deploy Production
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API to ACA
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: beag-training-prod
          containerAppName: ${{ vars.ACA_API_NAME || 'beag-training-api' }}
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          containerAppEnvironment: ${{ vars.ACA_ENV_NAME || 'beag-training-prod' }}
          targetPort: 8000
          ingress: external

      - name: Deploy Worker to ACA
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: beag-training-prod
          containerAppName: ${{ vars.ACA_WORKER_NAME || 'beag-training-worker' }}
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          containerAppEnvironment: ${{ vars.ACA_ENV_NAME || 'beag-training-prod' }}
          ingress: disabled
          containerAppCommand: worker

      - name: Tag release
        run: |
          git tag "model-training-$(date +%Y%m%d-%H%M)" && git push --tags || true

      - name: Health check production
        run: |
          for i in $(seq 1 15); do
            curl -sf "https://${{ vars.ACA_API_NAME }}.${{ vars.ACA_REGION }}.azurecontainerapps.io/health" && exit 0
            sleep 10
          done
          exit 1
